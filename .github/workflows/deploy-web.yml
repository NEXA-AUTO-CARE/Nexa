name: Deploy Nexa Frontend to AWS S3 & CloudFront

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-web.yml"
      - "package.json"
      - "pnpm-lock.yaml"

env:
  FORCE_JAVASCRIPT_ACTIONS_NODE_TYPE: node24

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Package
        run: pnpm --filter @nexa/shared run build

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}

      - name: Fetch frontend secrets from AWS Secrets Manager
        id: secrets
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "nexa/production/frontend-config" \
            --query 'SecretString' --output text)

          echo "VITE_STRIPE_PUBLISHABLE_KEY=$(echo "$SECRET_JSON" | jq -r '.stripePublishableKey')" >> $GITHUB_ENV
          echo "VITE_GOOGLE_MAPS_KEY=$(echo "$SECRET_JSON" | jq -r '.googleMapsKey')" >> $GITHUB_ENV
          echo "VITE_IDEAL_POSTCODES_API_KEY=$(echo "$SECRET_JSON" | jq -r '.idealPostcodesApiKey')" >> $GITHUB_ENV
          echo "VITE_API_BASE_URL=/api" >> $GITHUB_ENV

      - name: Build Frontend Web App
        run: pnpm --filter @nexa/web run build



      - name: Deploy static files to S3 bucket
        run: |
          aws s3 sync apps/web/dist s3://${{ vars.S3_WEB_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
