name: Deploy Nexa API to AWS ECS

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "infra/**"
      - ".github/workflows/deploy-api.yml"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  id-token: write # Required for requesting JWT OIDC tokens from AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }} # Using secure OIDC role assumption
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up QEMU for ARM64 builds
        uses: docker/setup-qemu-action@v3

      - name: Build, tag, and push API image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: nexa-api-production
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f apps/api/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition NexaApiServiceStackproductionApiTaskDef2BC1B8C9 --query taskDefinition > task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ApiContainer
          image: ${{ steps.build-image.outputs.image }}

      - name: Register and Run Database Migrations
        run: |
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' ${{ steps.render-task-def.outputs.task-definition }} > clean-task-def.json
          NEW_TASK_DEF=$(aws ecs register-task-definition --cli-input-json file://clean-task-def.json --query 'taskDefinition.taskDefinitionArn' --output text)

          NETWORK_CONFIG=$(aws ecs describe-services --cluster nexa-cluster-production --services nexa-api-production --query 'services[0].networkConfiguration' --output json)

          echo "Starting migration task using definition $NEW_TASK_DEF"
          TASK_ARN=$(aws ecs run-task \
            --cluster nexa-cluster-production \
            --task-definition $NEW_TASK_DEF \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides '{"containerOverrides":[{"name":"ApiContainer","command":["node", "./node_modules/typeorm/cli.js", "migration:run", "-d", "dist/data-source.js"]}]}' \
            --started-by "github-actions-migration" \
            --query 'tasks[0].taskArn' \
            --output text)
            
          echo "Waiting for migration task ($TASK_ARN) to complete..."
          aws ecs wait tasks-stopped --cluster nexa-cluster-production --tasks $TASK_ARN

          EXIT_CODE=$(aws ecs describe-tasks --cluster nexa-cluster-production --tasks $TASK_ARN --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task failed with exit code $EXIT_CODE."
            aws logs get-log-events --log-group-name /ecs/nexa-api-production --log-stream-name nexa-api/ApiContainer/${TASK_ARN##*/} --query 'events[*].message' --output text
            exit 1
          fi
          echo "Database migrations completed successfully."

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: nexa-api-production
          cluster: nexa-cluster-production
          wait-for-service-stability: true
